[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "SIM",  # flake8-simplify
  "C4",   # flake8-comprehensions
  "RUF",  # ruff-specific
  "D",    # pydocstyle
  "PT",   # flake8-pytest-style
  "TRY",  # tryceratops
  "BLE",  # flake8-blind-except
]
ignore = [
  "D203",    # incompatible with D211
  "D213",    # incompatible with D212
  "TRY003",  # long messages outside exception class are fine here
  "D202",    # this repo puts a blank line after every docstring
  "TRY301",  # _get deliberately raises inside its try block
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D101", "D102", "D103", "D107"]  # tests document themselves by name

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"
